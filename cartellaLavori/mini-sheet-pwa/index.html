<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mini-Foglio di Calcolo</title>
  <meta name="description" content="Foglio di calcolo semplificato installabile e utilizzabile offline">
  <meta name="theme-color" content="#198754">
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" crossorigin="anonymous">
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <div class="d-flex flex-wrap align-items-center gap-2 p-2 border-bottom bg-light">
    <strong class="text-success">Mini-Foglio</strong>
    <input id="namebox" class="form-control form-control-sm text-center" style="width:72px" readonly aria-label="Cella selezionata">
    <span class="fw-bold">fx</span>
    <input id="fbar" class="form-control form-control-sm flex-grow-1" style="min-width:140px;width:auto" autocomplete="off" spellcheck="false" aria-label="Barra della formula">
    <div class="btn-group btn-group-sm" role="group" aria-label="Righe e colonne">
      <button id="btnAddRow" class="btn btn-outline-secondary" title="Inserisci una riga sopra la selezione">+Riga</button>
      <button id="btnDelRow" class="btn btn-outline-secondary" title="Elimina la riga selezionata">−Riga</button>
      <button id="btnAddCol" class="btn btn-outline-secondary" title="Inserisci una colonna a sinistra della selezione">+Col</button>
      <button id="btnDelCol" class="btn btn-outline-secondary" title="Elimina la colonna selezionata">−Col</button>
    </div>
    <button id="btnCsv" class="btn btn-sm btn-outline-success">CSV</button>
    <button id="btnClear" class="btn btn-sm btn-outline-danger">Svuota</button>
    <button id="btnInstall" class="btn btn-sm btn-success d-none">Installa</button>
    <span id="net" class="badge text-bg-secondary">online</span>
  </div>
  <div id="gridWrap">
    <div id="corner"></div>
    <div id="colH"><div id="colHi"></div></div>
    <div id="rowH"><div id="rowHi"></div></div>
    <div id="viewport" tabindex="0">
      <div id="sizer">
        <div id="bandR"></div><div id="bandC"></div>
        <div id="cells"></div>
        <div id="selBox"></div>
        <input id="editor" autocomplete="off" spellcheck="false" aria-label="Modifica cella">
      </div>
    </div>
  </div>
  <div id="status" class="small px-2 py-1 border-top text-muted">Pronto</div>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
