<!DOCTYPE html>
<html lang="it">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Andamento Nazionale COVID-19</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f4f6f9;
      color: #333;
      margin: 0;
      padding: 30px 15px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      background-color: #ffffff;
      border-radius: 10px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
      padding: 25px;
    }

    h2 {
      margin-top: 0;
      color: #1e293b;
      font-size: 1.5rem;
      border-bottom: 2px solid #e2e8f0;
      padding-bottom: 12px;
      margin-bottom: 20px;
    }

    .table-wrapper {
      max-height: 75vh;
      overflow-y: auto;
      overflow-x: auto;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
    }

    table {
      border-collapse: collapse;
      width: 100%;
      font-size: 0.92rem;
    }

    th {
      position: sticky;
      top: 0;
      background-color: #0f172a;
      color: #ffffff;
      font-weight: 600;
      text-transform: uppercase;
      font-size: 0.78rem;
      letter-spacing: 0.5px;
      padding: 14px 12px;
      text-align: right;
      z-index: 1;
    }

    th:first-child {
      text-align: center;
    }

    td {
      padding: 11px 12px;
      border-bottom: 1px solid #e2e8f0;
      text-align: right;
      font-variant-numeric: tabular-nums;
      /* Allinea perfettamente le cifre in colonna */
    }

    td:first-child {
      text-align: center;
      font-weight: 600;
      color: #0f172a;
      white-space: nowrap;
    }

    /* Righe alternate */
    tbody tr:nth-child(even) {
      background-color: #f8fafc;
    }

    /* Evidenziazione al passaggio del mouse */
    tbody tr:hover {
      background-color: #e0f2fe;
      transition: background-color 0.15s ease;
    }

    .loading {
      text-align: center;
      padding: 40px;
      color: #64748b;
      font-size: 1.1rem;
    }
  </style>
</head>

<body>

  <h2>Dati COVID-19 - Andamento Nazionale</h2>
  <div id="demo">Caricamento dati in corso...</div>

  <script>
    var xmlhttp = new XMLHttpRequest();

    xmlhttp.onload = function () {
      if (this.status == 200) {
        // Converte il testo JSON ricevuto in un array di oggetti JavaScript
        var dati = JSON.parse(this.responseText);
        var txt = "";
        var i;

        txt += "<table>";
        txt += "<tr>";
        txt += "<th>Data</th>";
        txt += "<th>Nuovi Positivi</th>";
        txt += "<th>Totale Positivi</th>";
        txt += "<th>Ricoverati con Sintomi</th>";
        txt += "<th>Terapia Intensiva</th>";
        txt += "<th>Dimessi Guariti</th>";
        txt += "<th>Deceduti</th>";
        txt += "<th>Totale Casi</th>";
        txt += "</tr>";

        for (i = 0; i < dati.length; i++) {
          // Estrae solo la parte YYYY-MM-DD della data (es. "2020-02-24")
          var dataSoloGiorno = dati[i].data.split("T")[0];

          txt += "<tr>";
          txt += "<td>" + dataSoloGiorno + "</td>";
          txt += "<td>" + dati[i].nuovi_positivi + "</td>";
          txt += "<td>" + dati[i].totale_positivi + "</td>";
          txt += "<td>" + dati[i].ricoverati_con_sintomi + "</td>";
          txt += "<td>" + dati[i].terapia_intensiva + "</td>";
          txt += "<td>" + dati[i].dimessi_guariti + "</td>";
          txt += "<td>" + dati[i].deceduti + "</td>";
          txt += "<td>" + dati[i].totale_casi + "</td>";
          txt += "</tr>";
        }

        txt += "</table>";
        document.getElementById("demo").innerHTML = txt;
      } else {
        document.getElementById("demo").innerHTML = "Errore nel caricamento dei dati.";
      }
    };

    xmlhttp.open("GET", "https://raw.githubusercontent.com/pcm-dpc/COVID-19/master/dati-json/dpc-covid19-ita-andamento-nazionale.json", true);
    xmlhttp.send();
  </script>

</body>

</html>
