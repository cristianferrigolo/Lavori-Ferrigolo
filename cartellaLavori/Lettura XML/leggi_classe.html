<!DOCTYPE html>
<html lang="it">

<head>
  <meta charset="UTF-8">
  <title>Anagrafica (XML)</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f2f2f2;
      color: #333;
      margin: 20px;
    }

    h1 {
      color: #2c4a6e;
      border-bottom: 3px solid #4a7ab5;
      padding-bottom: 8px;
    }

    p {
      font-size: 16px;
    }

    #demo {
      margin-top: 20px;
    }

    table {
      border-collapse: collapse;
      background-color: white;
      min-width: 400px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
    }

    th,
    td {
      border: 1px solid #999;
      padding: 8px 14px;
      text-align: center;
    }

    th {
      background-color: #4a7ab5;
      color: white;
    }

    tr:nth-child(even) {
      background-color: #e9eef5;
    }

    tr:hover {
      background-color: #d4e2f4;
    }
  </style>
</head>

<body>

  <h1>Elenco utenti</h1>
  <p>I dati vengono letti da un file <b>XML</b> con XMLHttpRequest.</p>

  <div id="demo"></div>

  <script>
    var xmlhttp = new XMLHttpRequest();

    xmlhttp.onload = function () {
      if (this.status == 200) {
        var xmlDoc = this.responseXML;
        var utenti = xmlDoc.getElementsByTagName("utente");
        var txt = "";
        var i;

        txt += "<table>";
        txt += "<tr>";
        txt += "<th>N.</th>";
        txt += "<th>Nome</th>";
        txt += "<th>Cognome</th>";
        txt += "</tr>";

        for (i = 0; i < utenti.length; i++) {
          txt += "<tr>";
          txt += "<td>" + (i + 1) + "</td>";
          txt += "<td>" + utenti[i].getElementsByTagName("nome")[0].childNodes[0].nodeValue + "</td>";
          txt += "<td>" + utenti[i].getElementsByTagName("cognome")[0].childNodes[0].nodeValue + "</td>";
          txt += "</tr>";
        }

        txt += "</table>";
        document.getElementById("demo").innerHTML = txt;
      }
    };

    xmlhttp.open("GET", "https://ppetrozzi.github.io/lavori/xml/nomi.xml", true);
    xmlhttp.send();
  </script>

</body>

</html>
