<!DOCTYPE html>
<html lang="it">

<head>
  <meta charset="UTF-8">
  <title>Anagrafica (XML)</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <h1>Elenco utenti</h1>
  <p>I dati vengono letti da un file <b>XML</b> con XMLHttpRequest.</p>

  <div id="demo"></div>

  <script>
    var xmlhttp = new XMLHttpRequest();

    xmlhttp.onload = function () {
      if (this.status == 200) {
        var xmlDoc = this.responseXML;
        var utenti = xmlDoc.getElementsByTagName("utente");
        var txt = "";
        var i;

        txt += "<table>";
        txt += "<tr>";
        txt += "<th>N.</th>";
        txt += "<th>Nome</th>";
        txt += "<th>Cognome</th>";
        txt += "</tr>";

        for (i = 0; i < utenti.length; i++) {
          txt += "<tr>";
          txt += "<td>" + (i + 1) + "</td>";
          txt += "<td>" + utenti[i].getElementsByTagName("nome")[0].childNodes[0].nodeValue + "</td>";
          txt += "<td>" + utenti[i].getElementsByTagName("cognome")[0].childNodes[0].nodeValue + "</td>";
          txt += "</tr>";
        }

        txt += "</table>";
        document.getElementById("demo").innerHTML = txt;
      }
    };

    xmlhttp.open("GET", "https://ppetrozzi.github.io/lavori/xml/nomi.xml", true);
    xmlhttp.send();
  </script>

</body>

</html>
